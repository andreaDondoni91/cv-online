<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#12213A"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- terminal dots -->
  <circle cx="96" cy="150" r="9" fill="#E0982A"/>
  <circle cx="126" cy="150" r="9" fill="#0E7C86"/>
  <circle cx="156" cy="150" r="9" fill="#5B6B7F"/>

  <!-- version pill, echoing the changelog concept -->
  <rect x="984" y="132" width="120" height="40" rx="20" fill="#E0982A"/>
  <text x="1044" y="159" font-family="Liberation Mono, monospace" font-size="23" font-weight="600" fill="#12213A" text-anchor="middle">v6.0.0</text>

  <!-- eyebrow path -->
  <text x="90" y="242" font-family="Liberation Mono, monospace" font-size="27" fill="#8FD6CE">~/andrea-dondoni · frontend-developer.git</text>

  <!-- name -->
  <text x="86" y="360" font-family="Liberation Sans, sans-serif" font-size="96" font-weight="700" fill="#FBFCFE" letter-spacing="-1">Andrea Dondoni</text>

  <!-- role -->
  <text x="90" y="428" font-family="Liberation Mono, monospace" font-size="34" fill="#CFE8E6">Frontend Developer · 10+ anni di esperienza</text>

  <!-- tagline -->
  <text x="90" y="486" font-family="Liberation Sans, sans-serif" font-size="30" fill="#9FB4C7">Interfacce che restano in produzione, oltre il framework.</text>
</svg>
