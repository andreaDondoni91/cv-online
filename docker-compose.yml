name: cv-online

services:
  web:
    build: .
    image: cv-online:latest
    container_name: cv-online
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
    name: cv-online-node-modules

networks:
  default:
    name: cv-online-network
